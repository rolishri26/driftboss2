<!DOCTYPE html>
<html>
<head>
<title>Drift Boss 2 - Clean Working Base</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:#87CEEB;
}
canvas {
  display:block;
  margin:auto;
  background:#6ec6ff;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

let spaceHeld = false;
let cameraY = 0;

let trackWidth = 400;
let track = [];

let car = {
  x: canvas.width / 2,
  y: 500,
  width: 60,
  height: 120,
  angle: 0,
  speed: 4
};

// Controls
document.addEventListener("keydown", e => {
  if(e.code === "Space") spaceHeld = true;
});

document.addEventListener("keyup", e => {
  if(e.code === "Space") spaceHeld = false;
});

canvas.addEventListener("touchstart", e=>{
  spaceHeld = true;
  e.preventDefault();
});

canvas.addEventListener("touchend", e=>{
  spaceHeld = false;
  e.preventDefault();
});

// Create starting track
function initTrack(){
  track = [];
  for(let i=0;i<30;i++){
    let x = canvas.width/2;
    let y = 500 - i*100;

    if(i>6){
      let dir = Math.random()>0.5 ? 1 : -1;
      x = track[i-1].x + dir*140;
      x = Math.max(trackWidth/2,
          Math.min(canvas.width-trackWidth/2, x));
    }

    track.push({x,y});
  }

  car.x = track[0].x;
  car.y = track[0].y - 25;
}

// Generate endless track
function generateTrack(){
  let last = track[track.length-1];
  let dir = Math.random()>0.5 ? 1 : -1;

  let newX = last.x + dir*140;
  newX = Math.max(trackWidth/2,
        Math.min(canvas.width-trackWidth/2, newX));

  track.push({x:newX, y:last.y-100});
}

// Update game
function update(){

  if(spaceHeld){
    car.angle += 0.03;
  } else {
    car.angle -= 0.03;
  }

  car.angle = Math.max(-0.5, Math.min(0.5, car.angle));

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;

  cameraY = car.y - 400;

  while(track[track.length-1].y > car.y - 600){
    generateTrack();
  }

  // Check if off track
  let safe = false;

  for(let t of track){
    if(car.x > t.x - trackWidth/2 &&
       car.x < t.x + trackWidth/2 &&
       car.y > t.y - 50 &&
       car.y < t.y + 50){
      safe = true;
      break;
    }
  }

  if(!safe){
    initTrack(); // simple reset
  }
}

// Draw
function drawTrack(){
  ctx.fillStyle = "#444";
  for(let t of track){
    ctx.fillRect(
      t.x - trackWidth/2,
      t.y - 50 - cameraY,
      trackWidth,
      100
    );
  }
}

function drawCar(){
  ctx.save();
  ctx.translate(car.x, car.y - cameraY);
  ctx.rotate(car.angle);
  ctx.fillStyle = "red";
  ctx.fillRect(
    -car.width/2,
    -car.height/2,
    car.width,
    car.height
  );
  ctx.restore();
}

// Game loop
function loop(){
  update();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawTrack();
  drawCar();
  requestAnimationFrame(loop);
}

initTrack();
loop();
</script>

</body>
</html>
