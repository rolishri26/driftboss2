<!DOCTYPE html>
<html>
<head>
  <title>Drift Boss 2 - Single Player</title>
  <style>
    body { margin:0; background:#000; overflow:hidden; }
    canvas { display:block; margin:auto; background:linear-gradient(#222,#000); }
  </style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const TRACK_WIDTH = 200;
const TILE_SIZE = 60;
const SPEED = 3;

let spaceHeld = false;
document.addEventListener("keydown", e => {
  if (e.code === "Space") spaceHeld = true;
});
document.addEventListener("keyup", e => {
  if (e.code === "Space") spaceHeld = false;
});

class Track {
  constructor() {
    this.tiles = [];
    this.offsetY = 0;
    for (let i = 0; i < 15; i++) {
      this.tiles.push({ shift: 0 });
    }
  }

  update() {
    this.offsetY += SPEED;

    if (this.offsetY >= TILE_SIZE) {
      this.offsetY = 0;
      this.tiles.shift();

      let lastShift = this.tiles[this.tiles.length - 1].shift;
      let newShift = lastShift + (Math.random() > 0.5 ? 30 : -30);
      newShift = Math.max(-120, Math.min(120, newShift));
      this.tiles.push({ shift: newShift });
    }
  }

  draw() {
    for (let i = 0; i < this.tiles.length; i++) {
      let tile = this.tiles[i];
      let y = i * TILE_SIZE - this.offsetY;

      ctx.fillStyle = "#444";
      ctx.fillRect(
        canvas.width/2 - TRACK_WIDTH/2 + tile.shift,
        y,
        TRACK_WIDTH,
        TILE_SIZE
      );
    }
  }

  getCurrentX() {
    return canvas.width/2 - TRACK_WIDTH/2 + this.tiles[10].shift;
  }
}

class Car {
  constructor() {
    this.x = canvas.width/2;
    this.y = 500;
    this.angle = 0;
    this.alive = true;
    this.score = 0;
  }

  update(trackX) {
    if (!this.alive) return;

    this.score++;

    // SPACE = drift right
    if (spaceHeld) {
      this.angle += 0.06;
    } else {
      this.angle -= 0.06;
    }

    this.x += Math.sin(this.angle) * 4;

    if (this.x < trackX || this.x > trackX + TRACK_WIDTH) {
      this.alive = false;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);

    // Car body
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(-12, -20, 24, 40);

    // Windshield
    ctx.fillStyle = "#222";
    ctx.fillRect(-8, -15, 16, 10);

    // Wheels
    ctx.fillStyle = "black";
    ctx.fillRect(-14, -18, 4, 10);
    ctx.fillRect(10, -18, 4, 10);
    ctx.fillRect(-14, 8, 4, 10);
    ctx.fillRect(10, 8, 4, 10);

    ctx.restore();
  }
}

let track = new Track();
let car = new Car();

function drawUI() {
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + car.score, 20, 30);

  if (!car.alive) {
    ctx.fillStyle = "red";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 200, 280);
    ctx.font = "18px Arial";
    ctx.fillText("Refresh page to restart", 200, 320);
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  track.update();
  track.draw();

  car.update(track.getCurrentX());
  car.draw();

  drawUI();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
