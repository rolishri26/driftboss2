<!DOCTYPE html>
<html>
<head>
<title>Drift Boss - Stable Version</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#ui {
    position: absolute;
    top: 15px;
    left: 20px;
    color: white;
    font-size: 22px;
    z-index: 10;
}

#restartBtn {
    position: absolute;
    top: 15px;
    right: 20px;
    padding: 10px 15px;
    font-size: 16px;
    background: #222;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
</div>

<button id="restartBtn">Restart</button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gameSpeed = 4;

let car = {
    x: canvas.width / 2,
    y: canvas.height - 200,
    width: 25,
    height: 50,
    velocityX: 0
};

let track = [];
let trackWidth = 350;
let segmentHeight = 120;

let score = 0;
let highScore = localStorage.getItem("driftHighScore") || 0;
document.getElementById("highScore").innerText = "High Score: " + highScore;

let isTurning = false;
let gameOver = false;

// Generate smooth centered track
function generateTrack() {
    let centerX = canvas.width / 2;
    for (let i = 0; i < 20; i++) {
        track.push({
            x: centerX,
            y: i * segmentHeight - segmentHeight
        });
    }
}
generateTrack();

function updateTrack() {
    for (let segment of track) {
        segment.y += gameSpeed;
    }

    // recycle segments
    if (track[0].y > canvas.height) {
        track.shift();

        let last = track[track.length - 1];

        let newX = last.x + (Math.random() - 0.5) * 200;

        // keep track inside screen
        newX = Math.max(trackWidth/2, newX);
        newX = Math.min(canvas.width - trackWidth/2, newX);

        track.push({
            x: newX,
            y: last.y - segmentHeight
        });

        score++;
        document.getElementById("score").innerText = "Score: " + score;
    }
}

function updateCar() {
    if (isTurning) {
        car.velocityX = 5;
    } else {
        car.velocityX = -5;
    }

    car.x += car.velocityX;
}

function checkCollision() {
    let currentSegment = track.find(seg =>
        car.y > seg.y && car.y < seg.y + segmentHeight
    );

    if (!currentSegment) return;

    if (
        car.x < currentSegment.x - trackWidth/2 ||
        car.x > currentSegment.x + trackWidth/2
    ) {
        gameOver = true;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("driftHighScore", highScore);
        }
    }
}

function drawTrack() {
    ctx.fillStyle = "#444";
    for (let segment of track) {
        ctx.fillRect(
            segment.x - trackWidth/2,
            segment.y,
            trackWidth,
            segmentHeight
        );
    }
}

function drawCar() {
    ctx.fillStyle = "red";
    ctx.fillRect(
        car.x - car.width/2,
        car.y,
        car.width,
        car.height
    );
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        updateTrack();
        updateCar();
        checkCollision();
    } else {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width/2 - 120, canvas.height/2);
    }

    drawTrack();
    drawCar();

    requestAnimationFrame(gameLoop);
}

gameLoop();

// Controls
document.addEventListener("keydown", e => {
    if (e.code === "Space") isTurning = true;
});
document.addEventListener("keyup", e => {
    if (e.code === "Space") isTurning = false;
});

document.addEventListener("touchstart", () => isTurning = true);
document.addEventListener("touchend", () => isTurning = false);

document.getElementById("restartBtn").onclick = function() {
    score = 0;
    car.x = canvas.width / 2;
    gameOver = false;
    document.getElementById("score").innerText = "Score: 0";
};
</script>

</body>
</html>
