<!DOCTYPE html>
<html>
<head>
<title>Drift Boss 2 – Poki‑Style Red Car</title>
<style>
body { margin:0; overflow:hidden; background:#87CEEB; font-family:Arial, sans-serif; }
canvas { display:block; margin:auto; background:#6ec6ff; }

#coinsBtn, #redoBtn {
    position:absolute;
    top:10px;
    left:10px;
    padding:10px 20px;
    font-size:18px;
    background:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
#redoBtn { top:50px; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<button id="coinsBtn">Coins: 0</button>
<button id="redoBtn">Redo</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 800;
canvas.height = 600;

// Game variables
let score = 0;
let coinsCollected = 0;
let spaceHeld = false;
let cameraY = 0;

// Track & car
let trackWidth = 400;
let track = [];
let car = { x:0, y:0, width:60, height:120, angle:0, speed:4 };

// Smoke
let smokeParticles = [];

// Coins
let coins = [];

document.addEventListener("keydown", e => { if(e.code==="Space") spaceHeld=true; });
document.addEventListener("keyup", e => { if(e.code==="Space") spaceHeld=false; });
canvas.addEventListener("touchstart", e=>{ spaceHeld=true; e.preventDefault(); });
canvas.addEventListener("touchend", e=>{ spaceHeld=false; e.preventDefault(); });

// Embedded red car sprite (top‑down)
const carSprite = new Image();
carSprite.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADwAAAA8CAYAAABqL6UFAAAACXBIWXMAAAsTAAALEwEAmpwYAAABOElEQVR4nO2YsQ2AIAxFC7YgXGQ4VpcS8IBq47aTS3qTzM7CP6dYt3kYAAAAAAAAAAIBnzfiFZYpJZb93FcnVP6BjKh4eRNg1jF8hPNG4pzoB3K6wA6i9/jS98WhfxXRvgm+fhehG90pKgHSrZq264x0Hci19mxIY0E8R0P2kye4FpI0CPI49GCRnhnQvQUyx6TC/wElkCPSmx3VguAfS0bpFnAh6C1H0DX4kLYL7URtA70HbUp3gKh9YF+g/3Q9oLB/WiD6D/dD2gsH9aIPoP90PaCwf1og+gP90PaCwf1og+gP/4P1/8K+7EQU+rjwIKnBMGT7oNQAAAAASUVORK5CYII=";

// Initialize
function initGame(){
    score=0;
    spaceHeld=false;
    cameraY=0;
    track=[];
    coins=[];
    smokeParticles=[];
    for(let i=0;i<25;i++){
        let x = canvas.width/2;
        let y = 500 - i*100;
        if(i>=7){ let dir = Math.random()>0.5?1:-1; let shift=140; x = track[i-1].x + dir*shift; x = Math.max(trackWidth/2, Math.min(canvas.width-trackWidth/2, x)); }
        track.push({x:x, y:y});
        if(i%3===0) coins.push({x:x, y:y-50, collected:false});
    }
    car.x = track[0].x;
    car.y = track[0].y - 25;
    coinsCollected = 0;
    document.getElementById("coinsBtn").innerText = "Coins: " + coinsCollected;
}

// Generate new track
function generateTrack(){
    let last=track[track.length-1];
    let dir=Math.random()>0.5?1:-1;
    let shift=140;
    let newX=last.x + dir*shift;
    newX = Math.max(trackWidth/2, Math.min(canvas.width-trackWidth/2, newX));
    track.push({x:newX, y:last.y-100});
    if(track.length%3===0) coins.push({x:newX,y:last.y-150,collected:false});
}

// Update
function update(){
    score++;
    if(spaceHeld){ car.angle += 0.03; smokeParticles.push({x:car.x,y:car.y,alpha:1,radius:Math.random()*5+5}); }
    else car.angle -= 0.03;
    car.angle = Math.max(-0.5, Math.min(0.5, car.angle));

    // Move car
    car.x += Math.sin(car.angle)*car.speed;
    car.y -= Math.cos(car.angle)*car.speed;
    cameraY = car.y - 400;

    // Endless track
    while(track[track.length-1].y > car.y - 600) generateTrack();

    // Cleanup
    if(track[0].y - cameraY > canvas.height + 100) track.shift();
    coins = coins.filter(c => c.y - cameraY < canvas.height + 50);

    // Collect coins
    coins.forEach(c => {
        if(!c.collected && Math.abs(car.x - c.x) < 30 && Math.abs(car.y - c.y) < 35){
            c.collected = true;
            coinsCollected++;
            document.getElementById("coinsBtn").innerText = "Coins: " + coinsCollected;
        }
    });

    // Fall off track -> restart
    let safe=false;
    track.forEach(t => {
        if(car.x > t.x-trackWidth/2 && car.x < t.x+trackWidth/2 &&
           car.y > t.y-50 && car.y < t.y+50) safe=true;
    });
    if(!safe) initGame();

    smokeParticles = smokeParticles.map(s => ({x:s.x,y:s.y+1,alpha:s.alpha-0.02,radius:s.radius})).filter(s=>s.alpha>0);
}

// Drawing functions
function drawTrack(){
    ctx.fillStyle="#444";
    track.forEach(t => ctx.fillRect(t.x-trackWidth/2, t.y-50-cameraY, trackWidth,100));
}

function drawCoins(){
    coins.forEach(c => {
        if(!c.collected){
            ctx.fillStyle="gold";
            ctx.beginPath();
            ctx.arc(c.x, c.y-cameraY, 15, 0, Math.PI*2);
            ctx.fill();
        }
    });
}

function drawSmoke(){
    smokeParticles.forEach(s => {
        ctx.fillStyle = `rgba(200,200,200,${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y-cameraY, s.radius,0,Math.PI*2);
        ctx.fill();
    });
}

function drawCar(){
    ctx.save();
    ctx.translate(car.x,car.y-cameraY);
    ctx.rotate(car.angle);
    ctx.drawImage(carSprite, -car.width/2, -car.height/2, car.width, car.height);
    ctx.restore();
}

function drawUI(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="white";
    ctx.font="20px Arial";
    ctx.fillText("Score: " + score, 20, 30);
}

// Main loop
function loop(){
    update();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTrack();
    drawCoins();
    drawSmoke();
    drawCar();
    drawUI();
    requestAnimationFrame(loop);
}

document.getElementById("redoBtn").addEventListener("click",()=>{initGame();});
initGame();
loop();
</script>

</body>
</html>
