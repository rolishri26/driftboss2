<!DOCTYPE html>
<html>
<head>
<title>Drift Boss 2 - Poki Style</title>
<style>
body { margin:0; overflow:hidden; background:#87CEEB; }
canvas { display:block; margin:auto; background:#6ec6ff; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 800;
canvas.height = 600;

let score = 0;
let gameOver = false;
let spaceHeld = false;

// Drift controls
document.addEventListener("keydown", e => { if(e.code === "Space") spaceHeld = true; });
document.addEventListener("keyup", e => { if(e.code === "Space") spaceHeld = false; });

// Track configuration
let trackWidth = 160; // wider for easier start

// Track array
let track = [];

// Generate first 7 straight tiles (safe start)
for(let i=0; i<7; i++){
    track.push({ x: canvas.width/2, y: 500 - i*100 });
}

// Then generate slightly zig-zagging tiles, but easy
for(let i=7; i<25; i++){
    let last = track[track.length-1];
    let dir = Math.random() > 0.5 ? 1 : -1;
    let shift = 80; // smaller than full width, easier for player
    let newX = last.x + dir * shift;
    newX = Math.max(trackWidth/2, Math.min(canvas.width - trackWidth/2, newX));
    track.push({ x: newX, y: last.y - 100 });
}

// Load your car image
const carSprite = new Image();
carSprite.src = "car.png"; // replace with your car picture

// Car object
let car = {
    x: track[0].x,
    y: track[0].y - 25,
    angle: 0,
    width: 60,   // proper car width
    height: 120, // proper car height
    speed: 4
};

// Generate new track tiles
function generateTrack(){
    let last = track[track.length-1];
    let dir = Math.random() > 0.5 ? 1 : -1;
    let shift = 80;
    let newX = last.x + dir*shift;
    newX = Math.max(trackWidth/2, Math.min(canvas.width - trackWidth/2, newX));
    track.push({ x: newX, y: last.y - 100 });
}

// Update car and game logic
function update(){
    if(gameOver) return;

    score++;

    // Drift logic
    if(spaceHeld){
        car.angle += 0.03; // drift right
    } else {
        car.angle -= 0.03; // drift left
    }

    car.angle = Math.max(-0.5, Math.min(0.5, car.angle));

    // Move forward based on angle
    car.x += Math.sin(car.angle) * car.speed;
    car.y -= Math.cos(car.angle) * car.speed;

    // Generate tiles if needed
    if(track.length < 30) generateTrack();

    // Check collision
    let safe = false;
    for(let piece of track){
        if(car.x > piece.x - trackWidth/2 && car.x < piece.x + trackWidth/2 &&
           car.y < piece.y + 50 && car.y > piece.y - 50){
            safe = true;
            break;
        }
    }
    if(!safe) gameOver = true;
}

// Draw track
function drawTrack(){
    ctx.fillStyle = "#444";
    for(let piece of track){
        ctx.fillRect(piece.x - trackWidth/2, piece.y - 50, trackWidth, 100);
    }
}

// Draw car with sprite
function drawCar(){
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.drawImage(carSprite, -car.width/2, -car.height/2, car.width, car.height);
    ctx.restore();
}

// Draw UI
function drawUI(){
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 20, 30);

    if(gameOver){
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 280, 300);
        ctx.font = "18px Arial";
        ctx.fillText("Refresh page to restart", 300, 340);
    }
}

// Main loop
function loop(){
    update();
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawTrack();
    drawCar();
    drawUI();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
