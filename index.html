<!DOCTYPE html>
<html>
<head>
<title>Drift Boss 2</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(#87CEEB, #4CAF50);
}

canvas {
  display: block;
  margin: auto;
  background: #6ec6ff;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 800;
canvas.height = 600;

let car = {
  x: 400,
  y: 300,
  angle: 0,
  size: 30,
  driftingRight: false,
  speed: 4
};

let track = [];
let trackWidth = 120;
let score = 0;
let gameOver = false;

// Generate initial straight track
for (let i = 0; i < 20; i++) {
  track.push({x: 400, y: 300 - i * 100});
}

// SPACE controls
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    car.driftingRight = true;
  }
});

document.addEventListener("keyup", (e) => {
  if (e.code === "Space") {
    car.driftingRight = false;
  }
});

function generateTrack() {
  let last = track[track.length - 1];
  let direction = Math.random() > 0.5 ? -1 : 1;

  track.push({
    x: last.x + direction * 100,
    y: last.y - 100
  });
}

function update() {
  if (gameOver) return;

  score += 1;

  // Drift movement
  if (car.driftingRight) {
    car.x += 3;
    car.angle = 0.3;
  } else {
    car.x -= 3;
    car.angle = -0.3;
  }

  car.y -= car.speed;

  // Camera effect
  ctx.translate(0, car.speed);

  // Generate new track
  if (track.length < 30) {
    generateTrack();
  }

  // Collision check
  let safe = false;
  for (let piece of track) {
    if (
      car.x > piece.x - trackWidth/2 &&
      car.x < piece.x + trackWidth/2 &&
      car.y < piece.y + 50 &&
      car.y > piece.y - 50
    ) {
      safe = true;
    }
  }

  if (!safe) {
    gameOver = true;
  }
}

function drawTrack() {
  ctx.fillStyle = "#333";
  for (let piece of track) {
    ctx.fillRect(
      piece.x - trackWidth/2,
      piece.y - 50,
      trackWidth,
      100
    );
  }
}

function drawCar() {
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.fillStyle = "red";
  ctx.fillRect(-15, -25, 30, 50);

  ctx.restore();
}

function drawUI() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);

  if (gameOver) {
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", 300, 300);
  }
}

function gameLoop() {
  update();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawTrack();
  drawCar();
  drawUI();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
