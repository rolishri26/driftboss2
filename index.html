<!DOCTYPE html>
<html>
<head>
<title>Drift Boss Stable</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial;
}

#ui {
    position: absolute;
    top: 15px;
    left: 20px;
    color: white;
    font-size: 22px;
}

#restartBtn {
    position: absolute;
    top: 15px;
    right: 20px;
    padding: 8px 14px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
</div>

<button id="restartBtn">Redo</button>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let track = [];
let segmentHeight = 120;
let trackWidth = 350;
let gameSpeed = 4;

let car;
let isTurning = false;
let score = 0;
let highScore = localStorage.getItem("driftHighScore") || 0;
let gameOver = false;

document.getElementById("highScore").innerText = "High Score: " + highScore;

function initGame() {

    track = [];
    score = 0;
    gameOver = false;

    car = {
        x: canvas.width / 2,
        y: canvas.height - 200,
        width: 25,
        height: 50
    };

    let center = canvas.width / 2;

    for (let i = 0; i < 20; i++) {
        track.push({
            x: center,
            y: i * segmentHeight - segmentHeight
        });
    }

    document.getElementById("score").innerText = "Score: 0";
}

function updateTrack() {
    for (let seg of track) {
        seg.y += gameSpeed;
    }

    if (track[0].y > canvas.height) {
        track.shift();

        let last = track[track.length - 1];

        let newX = last.x + (Math.random() - 0.5) * 200;
        newX = Math.max(trackWidth/2, newX);
        newX = Math.min(canvas.width - trackWidth/2, newX);

        track.push({
            x: newX,
            y: last.y - segmentHeight
        });

        score++;
        document.getElementById("score").innerText = "Score: " + score;
    }
}

function updateCar() {
    if (isTurning) {
        car.x += 5;
    } else {
        car.x -= 5;
    }
}

function checkCollision() {

    for (let seg of track) {
        if (car.y > seg.y && car.y < seg.y + segmentHeight) {

            if (
                car.x < seg.x - trackWidth/2 ||
                car.x > seg.x + trackWidth/2
            ) {
                gameOver = true;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("driftHighScore", highScore);
                    document.getElementById("highScore").innerText =
                        "High Score: " + highScore;
                }
            }

            break;
        }
    }
}

function drawTrack() {
    ctx.fillStyle = "#444";
    for (let seg of track) {
        ctx.fillRect(
            seg.x - trackWidth/2,
            seg.y,
            trackWidth,
            segmentHeight
        );
    }
}

function drawCar() {
    ctx.fillStyle = "red";
    ctx.fillRect(
        car.x - car.width/2,
        car.y,
        car.width,
        car.height
    );
}

function gameLoop() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameOver) {
        updateTrack();
        updateCar();
        checkCollision();
    } else {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width/2 - 120, canvas.height/2);
    }

    drawTrack();
    drawCar();

    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => {
    if (e.code === "Space") isTurning = true;
});

document.addEventListener("keyup", e => {
    if (e.code === "Space") isTurning = false;
});

document.addEventListener("touchstart", () => isTurning = true);
document.addEventListener("touchend", () => isTurning = false);

document.getElementById("restartBtn").onclick = function() {
    initGame();
};

initGame();
gameLoop();
</script>

</body>
</html>
