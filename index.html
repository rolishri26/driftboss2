<!DOCTYPE html>
<html>
<head>
<title>Drift Boss - Working Score Version</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#ui {
    position: absolute;
    top: 15px;
    left: 20px;
    color: white;
    font-size: 20px;
    z-index: 10;
}

#restartBtn {
    position: absolute;
    top: 15px;
    right: 20px;
    padding: 10px 15px;
    font-size: 16px;
    background: #222;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<div id="ui">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
</div>

<button id="restartBtn">Restart</button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let car = {
    x: canvas.width / 2,
    y: canvas.height - 150,
    width: 25,
    height: 50,
    speedX: 0
};

let track = [];
let trackWidth = 350;
let turnDirection = 1;

let score = 0;
let highScore = localStorage.getItem("driftHighScore") || 0;
document.getElementById("highScore").innerText = "High Score: " + highScore;

let gameOver = false;
let isTurning = false;

// Generate track
function generateTrack() {
    for (let i = 0; i < 200; i++) {
        track.push({
            x: canvas.width / 2,
            y: -i * 80
        });
    }
}

generateTrack();

function updateTrack() {
    for (let i = 0; i < track.length; i++) {
        track[i].y += 5;

        if (track[i].y > canvas.height) {
            track[i].y = -80;

            if (Math.random() < 0.4) {
                turnDirection *= -1;
            }

            track[i].x = track[(i - 1 + track.length) % track.length].x + turnDirection * 100;
        }
    }
}

function updateCar() {
    if (isTurning) {
        car.speedX = turnDirection * 6;
    } else {
        car.speedX *= 0.9;
    }

    car.x += car.speedX;
}

function checkCollision() {
    let nearest = track.reduce((a, b) =>
        Math.abs(b.y - car.y) < Math.abs(a.y - car.y) ? b : a
    );

    if (
        car.x < nearest.x - trackWidth / 2 ||
        car.x > nearest.x + trackWidth / 2
    ) {
        gameOver = true;

        if (score > highScore) {
            highScore = score;
            localStorage.setItem("driftHighScore", highScore);
        }
    }
}

function drawTrack() {
    ctx.fillStyle = "#444";
    for (let segment of track) {
        ctx.fillRect(
            segment.x - trackWidth / 2,
            segment.y,
            trackWidth,
            80
        );
    }
}

function drawCar() {
    ctx.fillStyle = "red";
    ctx.fillRect(car.x - car.width / 2, car.y, car.width, car.height);
}

function updateScore() {
    score++;
    document.getElementById("score").innerText = "Score: " + score;
}

function gameLoop() {
    if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText("Game Over", canvas.width / 2 - 100, canvas.height / 2);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateTrack();
    updateCar();
    checkCollision();
    updateScore();

    drawTrack();
    drawCar();

    requestAnimationFrame(gameLoop);
}

gameLoop();

// Controls
document.addEventListener("keydown", e => {
    if (e.code === "Space") {
        isTurning = true;
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "Space") {
        isTurning = false;
    }
});

// Touch controls
document.addEventListener("touchstart", () => {
    isTurning = true;
});

document.addEventListener("touchend", () => {
    isTurning = false;
});

// Restart button
document.getElementById("restartBtn").onclick = function() {
    score = 0;
    car.x = canvas.width / 2;
    gameOver = false;
    document.getElementById("score").innerText = "Score: 0";
    gameLoop();
};
</script>

</body>
</html>
