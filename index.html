<!DOCTYPE html>
<html>
<head>
<title>Drift Boss 2 - Coins & Car Insurance</title>
<style>
body { margin:0; overflow:hidden; background:#87CEEB; font-family:Arial, sans-serif; }
canvas { display:block; margin:auto; background:#6ec6ff; }
button {
  position:absolute; padding:10px 20px; font-size:18px;
  background:#fff; border:none; border-radius:8px; cursor:pointer;
}
#coinsBtn { top:10px; left:10px; }
#redoBtn { top:50px; left:10px; }
#insuranceBtn { top:90px; left:10px; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<button id="coinsBtn">Coins: 0</button>
<button id="redoBtn">Redo</button>
<button id="insuranceBtn">Buy Car Insurance (50)</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 800;
canvas.height = 600;

let score = 0;
let coinsCollected = 0;
let carInsurance = 0;
let spaceHeld = false;
let cameraY = 0;

let trackWidth = 400;
let track = [];
let coins = [];
let smokeParticles = [];

let car = {
  x: canvas.width/2,
  y: 500,
  width: 60,
  height: 120,
  angle: 0,
  speed: 4
};

document.addEventListener("keydown", e => { if(e.code==="Space") spaceHeld=true; });
document.addEventListener("keyup", e => { if(e.code==="Space") spaceHeld=false; });
canvas.addEventListener("touchstart", e=>{ spaceHeld=true; e.preventDefault(); });
canvas.addEventListener("touchend", e=>{ spaceHeld=false; e.preventDefault(); });

function initGame(){
  score = 0;
  cameraY = 0;
  track = [];
  coins = [];
  smokeParticles = [];

  for(let i=0;i<25;i++){
    let x = canvas.width/2;
    let y = 500 - i*100;
    if(i>=7){
      let dir = Math.random()>0.5?1:-1;
      x = track[i-1].x + dir*140;
      x = Math.max(trackWidth/2, Math.min(canvas.width-trackWidth/2, x));
    }
    track.push({x,y});
    if(i%3===0) coins.push({x,y:y-50,collected:false});
  }

  car.x = track[0].x;
  car.y = track[0].y - 25;
  car.angle = 0;

  document.getElementById("coinsBtn").innerText = "Coins: " + coinsCollected;
}

function generateTrack(){
  let last = track[track.length-1];
  let dir = Math.random()>0.5?1:-1;
  let newX = last.x + dir*140;
  newX = Math.max(trackWidth/2, Math.min(canvas.width-trackWidth/2, newX));
  track.push({x:newX, y:last.y-100});
  if(track.length%3===0) coins.push({x:newX,y:last.y-150,collected:false});
}

function update(){
  score++;

  if(spaceHeld){
    car.angle += 0.03;
    smokeParticles.push({x:car.x,y:car.y,alpha:1,radius:Math.random()*5+5});
  } else {
    car.angle -= 0.03;
  }

  car.angle = Math.max(-0.5, Math.min(0.5, car.angle));

  car.x += Math.sin(car.angle)*car.speed;
  car.y -= Math.cos(car.angle)*car.speed;

  cameraY = car.y - 400;

  while(track[track.length-1].y > car.y - 600){
    generateTrack();
  }

  coins.forEach(c=>{
    if(!c.collected && Math.abs(car.x-c.x)<30 && Math.abs(car.y-c.y)<35){
      c.collected=true;
      coinsCollected++;
      document.getElementById("coinsBtn").innerText = "Coins: " + coinsCollected;
    }
  });

  let safe=false;
  track.forEach(t=>{
    if(car.x>t.x-trackWidth/2 && car.x<t.x+trackWidth/2 &&
       car.y>t.y-50 && car.y<t.y+50){
      safe=true;
    }
  });

  if(!safe){
    initGame();  // simple reset (working behavior)
  }

  smokeParticles = smokeParticles
    .map(s=>({x:s.x,y:s.y+1,alpha:s.alpha-0.02,radius:s.radius}))
    .filter(s=>s.alpha>0);
}

function drawTrack(){
  ctx.fillStyle="#444";
  track.forEach(t=>{
    ctx.fillRect(t.x-trackWidth/2, t.y-50-cameraY, trackWidth,100);
  });
}

function drawCoins(){
  coins.forEach(c=>{
    if(!c.collected){
      ctx.fillStyle="gold";
      ctx.beginPath();
      ctx.arc(c.x,c.y-cameraY,20,0,Math.PI*2);
      ctx.fill();
    }
  });
}

function drawSmoke(){
  smokeParticles.forEach(s=>{
    ctx.fillStyle=`rgba(200,200,200,${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y-cameraY,s.radius,0,Math.PI*2);
    ctx.fill();
  });
}

function drawCar(){
  ctx.save();
  ctx.translate(car.x,car.y-cameraY);
  ctx.rotate(car.angle);
  ctx.fillStyle="red";
  ctx.fillRect(-car.width/2,-car.height/2,car.width,car.height);
  ctx.restore();
}

function drawUI(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,20,30);
}

function loop(){
  update();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawTrack();
  drawCoins();
  drawSmoke();
  drawCar();
  drawUI();
  requestAnimationFrame(loop);
}

document.getElementById("redoBtn").addEventListener("click",initGame);

document.getElementById("insuranceBtn").addEventListener("click",()=>{
  if(coinsCollected>=50){
    coinsCollected-=50;
    carInsurance++;
    document.getElementById("coinsBtn").innerText="Coins: "+coinsCollected;
  }
});

initGame();
loop();
</script>

</body>
</html>
